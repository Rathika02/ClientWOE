<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client WOE entry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>Client WOE entry</h1>
    </div>
    <p class="api-status" id="apiStatus" role="status">Checking API…</p>
  </header>

  <div class="banner" id="globalBanner" role="alert" hidden>
    <span id="globalBannerText"></span>
    <button type="button" class="link-btn" id="retryBtn">Retry</button>
  </div>

  <!-- ============================ Entry screen ============================ -->
  <main class="layout" id="entryView">

    <div class="col-main">

      <section class="panel" aria-labelledby="h-patient">
        <h2 id="h-patient">Client and patient</h2>

        <div class="field">
          <label for="clientId">Client</label>
          <select id="clientId">
            <option value="">Loading clients…</option>
          </select>
          <p class="err" data-for="clientId"></p>
        </div>

        <div class="field lookup">
          <label for="patientName">Patient name</label>
          <input id="patientName" type="text" maxlength="100" autocomplete="off"
                 placeholder="Start typing to find an existing patient, or enter a new name"
                 aria-autocomplete="list" aria-controls="patientSuggestions">
          <ul class="suggestions" id="patientSuggestions" role="listbox" hidden></ul>
          <p class="err" data-for="patientName"></p>
        </div>

        <div class="chip" id="existingChip" hidden>
          <span>Existing patient <strong id="existingCode"></strong></span>
          <button type="button" class="link-btn" id="clearPatientBtn">Enter a new patient instead</button>
        </div>

        <div class="row">
          <div class="field">
            <label for="age">Age</label>
            <input id="age" type="number" min="0" max="120" inputmode="numeric" placeholder="Years">
            <p class="err" data-for="age"></p>
          </div>
          <div class="field">
            <label for="gender">Gender</label>
            <select id="gender">
              <option value="">Select</option>
              <option value="0">Male</option>
              <option value="1">Female</option>
              <option value="2">Other</option>
            </select>
            <p class="err" data-for="gender"></p>
          </div>
          <div class="field">
            <label for="mobileNumber">Mobile number</label>
            <input id="mobileNumber" type="tel" maxlength="10" inputmode="numeric" placeholder="10 digits">
            <p class="err" data-for="mobileNumber"></p>
          </div>
        </div>
      </section>

      <section class="panel" aria-labelledby="h-tests">
        <div class="panel-head">
          <h2 id="h-tests">Tests</h2>
          <div class="search">
            <label class="sr-only" for="testSearch">Search tests</label>
            <input id="testSearch" type="search" placeholder="Search by name, code or category" autocomplete="off">
          </div>
        </div>
        <ul class="test-list" id="testList"></ul>
        <p class="empty" id="testEmpty" hidden>No tests match that search.</p>
      </section>

    </div>

    <aside class="slip" aria-labelledby="h-slip">
      <h2 id="h-slip">Order slip</h2>
      <p class="slip-meta" id="slipMeta">No client selected</p>

      <ul class="slip-items" id="slipItems"></ul>
      <p class="slip-empty" id="slipEmpty">Pick tests from the list. They appear here with quantity and amount.</p>
      <p class="err" data-for="tests"></p>

      <div class="slip-total">
        <span>Total</span>
        <strong id="totalAmount">₹0.00</strong>
      </div>

      <div class="banner inline" id="submitError" role="alert" hidden></div>

      <button type="button" class="btn primary" id="saveBtn">Save work order</button>
    </aside>

  </main>

  <!-- ============================ Saved screen ============================ -->
  <main class="result" id="resultView" hidden></main>

  <script src="app.js"></script>
</body>
</html>
